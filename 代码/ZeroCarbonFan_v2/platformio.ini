; PlatformIO 工程配置 —— 零碳新风智能家居系统 v2
;
; 结构约定（本项目特有，别照搬默认模板）：
;   platformio.ini 和 ZeroCarbonFan_v2.ino 是**同级**的，没有 src/ 目录。
;   源码全仓库只有那一份 .ino，这里用 src_dir 指过去把它当源码目录，
;   再用 build_src_filter 只认这一个文件 —— 避免把 .pio/ .vscode/ 里的
;   生成物也当成源码编进去。
;
;   这样 Arduino IDE 和 PlatformIO 两个工具都能用，且永远只有一份源码：
;     Arduino IDE  → 打开 ZeroCarbonFan_v2.ino（文件夹名与 .ino 同名，规矩没破）
;     PlatformIO   → 打开 代码/ZeroCarbonFan_v2/ 目录，点 Build
;
; ⚠️ 改代码只改 .ino。不要在本目录再建 src/ 放副本，会不同步。

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<ZeroCarbonFan_v2.ino>
monitor_speed = 115200
; ↑ 串口波特率，必须和代码里 Serial.begin(115200) 一致，
;   否则串口监视器看到的是乱码 —— 验证 PM2.5 采样就靠这行输出。

; 代码只用了 ESP32 Arduino 核心自带的 WiFi / WebServer / analogRead，
; 没有外部库，所以 lib_deps 是空的。以后装库再往这下面加。
