; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── 怎么选要编译哪个程序 ──────────────────────────────
; VS Code 底部状态栏有个环境名下拉框（PlatformIO 插件提供的），
; 点开选 env，再点 Build / Upload，就只编选中的那一份。
;
; ── 两件事要分清：「独立程序」和「模块」 ────────────────
;
; ① 独立程序（各带自己的 setup()/loop()）——**必须**用 build_src_filter 挑一个：
;      src/main.cpp              网页热点程序      ← [env:esp32dev]
;      src/sensorTest_pm2.5.cpp  PM2.5 测试程序     ← [env:sensor_pm25]
;    一起编译会报「multiple definition of setup/loop」直接失败。
;
;    ── 命名规范（两条，别混）─────────────────────────
;    文件名：**sensorTest_<被测对象>.cpp**
;      sensorTest_pm2.5.cpp（现在）／sensorTest_temp.cpp／sensorTest_humi.cpp
;    env 名：**[env:sensor_<被测对象>]**      ⚠️ **不能带点号**
;      [env:sensor_pm25]（现在）／[env:sensor_temp]／[env:sensor_humi]
;
;    ⚠️ 为什么 env 名要去掉点号：PlatformIO 限制了环境名的字符集，
;      只允许 a-z 0-9 下划线 连字符 —— 写在源码里（poetry 装的
;      platformio/project/config.py 第 44 行）：
;          ENVNAME_RE = re.compile(r"^[a-z\d\_\-]+$", flags=re.I)
;      写成 [env:sensor_pm2.5] 会被直接拒绝并报错：
;          Invalid environment name 'sensor_pm2.5'. The name can contain
;          alphanumeric, underscore, and hyphen characters (a-z, 0-9, -, _)
;      **文件名没有这个限制**，所以两边只差一个点号，别以为写错了。
;
; ② 模块（.h 头文件，**没有** setup/loop）——**不需要**动这里：
;      src/light.h  光照模块（引脚/阈值/lightInit/lightRead）
;    build_src_filter 只筛 .cpp/.c/.ino，**管不到头文件**。
;    所以后面加 PM2.5 模块、继电器、语音，各建一个 .h 就行，
;    main.cpp include 一次即可，**本文件一行都不用改**。
;
; ⚠️ 换程序 = 换 env，不要靠删文件来切换。
; ⚠️ 只有新增**独立测试程序**时才需要：① src/ 下加 .cpp ② 这里加 [env:xxx]
;
; ── 为什么有 default_envs ─────────────────────────────
; 不带 `-e` 跑 `pio run -t upload`（VS Code 有些任务就是这么调的）时，
; PlatformIO 默认会**依次处理 ini 里所有 env** —— 也就是挨个编译挨个烧录。
; 后果有两个：
;   1. 白烧好几遍（PlatformIO 不判断「板子里已经是这个了」）
;   2. **连续两次烧录必撞**：上一个烧完 esptool 会 Hard reset，
;      芯片随即进入「运行模式」，紧接着烧下一个就连不上 ——
;      报 `Wrong boot mode detected (0x13)! The chip needs to be in download mode.`
; 设了 default_envs 之后，不带 -e 就只处理这一个，问题消失。
;
; 要烧别的 env：状态栏切过去再 Upload —— PIO 会显式传 `-e <选中的>`，
; **优先级高于 default_envs**，不受这里影响。

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; 串口波特率。必须和代码里 Serial.begin(115200) 一致，
; 不一致的话串口监视器看到的是一片乱码。
monitor_speed = 115200
; 主程序：网页热点 + 光照 + PM2.5 + 温湿度。
; 各传感器逻辑在各自的 .h 里（light.h / pm25.h / dht11.h），会被一起编进来
; （.h 跟着 include 走，不受这个 filter 影响）。
build_src_filter = +<main.cpp>

; ── 外部库（本项目目前只在这里用到）──────────────────
; DHTesp —— ESP32 专用的 DHT11/DHT22 库。
; 为什么用它：DHT11 靠微秒级时序区分 0/1，而主程序开着 WiFi 热点，
; 中断会打断时序。DHTesp 是专为 ESP32 写的，比通用的 Adafruit DHT
; （用 pulseIn）成功率高不少。
;
; ⚠️ 只放在 esp32dev 这个 env 里 —— sensor_dht11（测试程序）用的是
;    手写位操作版，不需要装库，也就不会多下一次依赖。
; 名字里带空格，写全 owner/name 更保险（数字 ID 是 2029，可作备选）。
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@^1.19

[env:sensor_pm25]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 只编 PM2.5 传感器测试程序
build_src_filter = +<sensorTest_pm2.5.cpp>

[env:adctest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 只编 ADC 单独测试程序（排查模拟输入这条路本身好不好，与传感器无关）
build_src_filter = +<adcTest.cpp>

[env:sensor_dht11]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 只编 DHT11 温湿度测试程序（手写位操作，不需要装库）
build_src_filter = +<sensorTest_dht11.cpp>

[env:relaytest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 只编 4 路继电器测试程序（逐路点动，验证接线）
build_src_filter = +<relayTest.cpp>
