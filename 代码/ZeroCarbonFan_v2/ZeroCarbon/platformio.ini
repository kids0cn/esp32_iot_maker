; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── 怎么选要编译哪个程序 ──────────────────────────────
; VS Code 底部状态栏有个环境名下拉框（PlatformIO 插件提供的），
; 点开选 env，再点 Build / Upload，就只编选中的那一份。
;
; 关键是每个 env 里的 build_src_filter —— 它决定 src/ 下哪些文件参与编译。
; 之所以必须写它：src/ 里现在有两个程序，各自都有 setup() 和 loop()，
; 如果一起编译会报「重复定义」直接失败。一次只能放行一个。
;
; ⚠️ 换程序 = 换 env，不要靠删文件来切换。
; ⚠️ 新增测试程序时，记得：① 在 src/ 下加一个 .cpp
;                         ② 在这里加一个 [env:xxx] 并写好 build_src_filter

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; 串口波特率。必须和代码里 Serial.begin(115200) 一致，
; 不一致的话串口监视器看到的是一片乱码。
monitor_speed = 115200
; 只编网页热点这个程序
build_src_filter = +<main.cpp>

[env:sensor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 只编 PM2.5 传感器测试程序
build_src_filter = +<sensor_test.cpp>
